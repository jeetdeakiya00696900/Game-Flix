<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}GameFlix{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/custom.css"/>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#E50914",
            "primary-hover": "#b0070f",
            "surface": "#111111",
            "surface-2": "#1a1a1a",
            "surface-3": "#222222",
          },
          fontFamily: {
            "display": ["Be Vietnam Pro", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.375rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "full": "9999px"
          },
          boxShadow: {
            "glow": "0 0 20px rgba(229, 9, 20, 0.4)",
          }
        }
      }
    }
  </script>
  {% block head_extra %}{% endblock %}
</head>
<body class="bg-black font-display text-white min-h-screen flex flex-col">

  <!-- NAV -->
  <header id="main-nav" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
      <!-- Logo -->
      <a href="/" class="flex items-center gap-2 group">
        <svg class="size-7 text-primary transition-transform group-hover:scale-110" viewBox="0 0 48 48" fill="none">
          <path d="M6 6H42L36 24L42 42H6L12 24L6 6Z" fill="currentColor"/>
        </svg>
        <span class="text-2xl font-black tracking-tighter">GameFlix</span>
      </a>

      <!-- Desktop nav -->
      <nav class="hidden md:flex items-center gap-1">
        <a href="/" class="nav-link {% block nav_home %}{% endblock %}">Home</a>
        <a href="/search" class="nav-link {% block nav_search %}{% endblock %}">Browse</a>
        <a href="/favorites" class="nav-link {% block nav_fav %}{% endblock %}">Favorites</a>
      </nav>

      <!-- Right actions -->
      <div class="flex items-center gap-3">
        <a href="/search" class="flex h-9 w-9 items-center justify-center rounded-full text-gray-400 hover:bg-white/10 hover:text-white transition-all" aria-label="Search">
          <span class="material-symbols-outlined">search</span>
        </a>
        <!-- Mobile hamburger -->
        <button id="mobile-menu-btn" class="flex h-9 w-9 items-center justify-center rounded-full text-gray-400 hover:bg-white/10 hover:text-white transition-all md:hidden">
          <span class="material-symbols-outlined">menu</span>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="hidden md:hidden bg-black/95 backdrop-blur-md border-t border-white/10 px-4 py-4">
      <nav class="flex flex-col gap-2">
        <a href="/" class="mobile-nav-link {% block mob_home %}{% endblock %}">Home</a>
        <a href="/search" class="mobile-nav-link {% block mob_search %}{% endblock %}">Browse</a>
        <a href="/favorites" class="mobile-nav-link {% block mob_fav %}{% endblock %}">Favorites</a>
      </nav>
    </div>
  </header>

  <!-- PAGE CONTENT -->
  <main class="flex-1 pt-16">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="mt-auto border-t border-white/10 bg-black/60 backdrop-blur-md py-8 px-4">
    <div class="mx-auto max-w-7xl flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <svg class="size-5 text-primary" viewBox="0 0 48 48" fill="none">
          <path d="M6 6H42L36 24L42 42H6L12 24L6 6Z" fill="currentColor"/>
        </svg>
        <span class="font-bold">GameFlix</span>
      </div>
      <div class="flex items-center gap-6 text-sm text-gray-500">
        <a href="#" class="hover:text-white transition-colors">Privacy</a>
        <a href="#" class="hover:text-white transition-colors">Terms</a>
        <a href="#" class="hover:text-white transition-colors">Help</a>
      </div>
      <p class="text-xs text-gray-600">© 2025 GameFlix. Powered by IGDB.</p>
    </div>
  </footer>

  <!-- SHARED SCRIPTS -->
  <script src="/static/js/utils.js"></script>
  <script>
    // Nav scroll effect
    const nav = document.getElementById('main-nav');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 20) {
        nav.classList.add('bg-black/90', 'backdrop-blur-md', 'border-b', 'border-white/10');
      } else {
        nav.classList.remove('bg-black/90', 'backdrop-blur-md', 'border-b', 'border-white/10');
      }
    });

    // Mobile menu
    document.getElementById('mobile-menu-btn').addEventListener('click', () => {
      document.getElementById('mobile-menu').classList.toggle('hidden');
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
